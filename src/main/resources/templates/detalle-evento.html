<!DOCTYPE html>
<html lang="es" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${evento.titulo}">Detalle Evento - Eventia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{css/main.css}">
    <style>
        .hero-image {
            height: 400px;
            object-fit: cover;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        }
        .event-detail-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 210, 211, 0.1);
            overflow: hidden;
        }
        .ticket-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 210, 211, 0.1);
            position: sticky;
            top: 2rem;
        }
        .ticket-type {
            border: 2px solid #f1f5f9;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }
        .ticket-type:hover {
            border-color: rgba(0, 210, 211, 0.3);
            box-shadow: 0 4px 16px rgba(0, 210, 211, 0.1);
        }
        .ticket-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: #00D2D3;
        }
        .btn-add-cart {
            background: linear-gradient(135deg, #00D2D3, #00a0a0);
            border: none;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
        }
        .btn-add-cart:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 210, 211, 0.3);
        }
        .btn-add-cart:disabled {
            background: #e2e8f0;
            color: #94a3b8;
            transform: none;
            box-shadow: none;
        }
        .breadcrumb {
            background: transparent;
            padding: 0;
            margin-bottom: 2rem;
        }
        .breadcrumb-item a {
            color: #00D2D3;
            text-decoration: none;
        }
        .breadcrumb-item.active {
            color: #64748b;
        }
        .event-info {
            background: #f8fafc;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }
        .info-item i {
            color: #00D2D3;
            margin-right: 1rem;
            font-size: 1.2rem;
        }
        .free-badge {
            background: linear-gradient(135deg, #00D2D3, #00a0a0);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .back-btn {
            background: transparent;
            border: 2px solid #e2e8f0;
            color: #64748b;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }
        .back-btn:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
            color: #475569;
            text-decoration: none;
        }
    </style>
</head>
<body>
<nav th:replace="fragments/navbar :: navbar"></nav>

<main class="container app-container pb-5 mt-4">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">Inicio</a></li>
            <li class="breadcrumb-item"><a href="/eventos">Eventos</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${evento.titulo}">Detalle Evento</li>
        </ol>
    </nav>

    <!-- Hero Image -->
    <div class="mb-4">
        <img th:src="${evento.banner != null ? evento.banner : 'https://via.placeholder.com/1200x400/00D2D3/FFFFFF?text=Evento'}"
             alt="Imagen del evento" class="hero-image">
    </div>

    <div class="row g-4">
        <!-- Event Details -->
        <div class="col-lg-8">
            <div class="event-detail-card">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <h1 class="card-title h2 mb-0" th:text="${evento.titulo}">Evento</h1>
                        <span th:if="${evento.esGratuito}" class="free-badge">Gratuito</span>
                    </div>

                    <div class="event-info">
                        <div class="info-item">
                            <i class="bi bi-calendar-event"></i>
                            <div>
                                <strong>Fecha y Hora</strong><br>
                                <span th:text="${#temporals.format(evento.fechaInicio, 'EEEE, dd \'de\' MMMM \'de\' yyyy \'a las\' HH:mm')}"></span> -
                                <span th:text="${#temporals.format(evento.fechaFin, 'HH:mm')}"></span>
                            </div>
                        </div>
                        <div class="info-item">
                            <i class="bi bi-geo-alt"></i>
                            <div>
                                <strong>Ubicación</strong><br>
                                <span th:text="${evento.direccion}"></span>,
                                <span th:text="${evento.distrito}"></span>,
                                <span th:text="${evento.ciudad}"></span>
                            </div>
                        </div>
                        <div class="info-item">
                            <i class="bi bi-person"></i>
                            <div>
                                <strong>Organizador</strong><br>
                                <span th:text="${organizador.nombre} + ' ' + ${organizador.apellido}"></span>
                            </div>
                        </div>
                        <div class="info-item">
                            <i class="bi bi-clock"></i>
                            <div>
                                <strong>Publicado</strong><br>
                                <span th:text="${#temporals.format(creadoEn, 'dd/MM/yyyy \'a las\' HH:mm')}"></span>
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <h3 class="h4 mb-3">Descripción</h3>
                        <p class="card-text lead" th:text="${evento.descripcion}"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Ticket Types -->
        <div class="col-lg-4">
            <div class="ticket-card">
                <div class="card-header bg-white border-bottom-0 p-4">
                    <h5 class="card-title mb-0"><i class="bi bi-ticket-perforated me-2"></i>Entradas Disponibles</h5>
                </div>
                <div class="card-body p-4">
                    <div th:if="${tiposTicket != null and !tiposTicket.empty}" th:each="tipo : ${tiposTicket}" class="ticket-type">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h6 class="mb-0" th:text="${tipo.nombre}">Tipo Ticket</h6>
                            <span class="ticket-price">S/ <span th:text="${#numbers.formatDecimal(tipo.precio, 1, 2)}">0.00</span></span>
                        </div>
                        <p class="text-muted small mb-3">
                            <span th:text="${tipo.cantidad}"></span> disponibles
                        </p>
                        <button class="btn btn-add-cart"
                                th:if="${tipo.cantidad > 0}"
                                th:data-id="${tipo.id}"
                                th:data-precio="${tipo.precio}"
                                th:data-nombre="${tipo.nombre}"
                                onclick="addToCart(this)">
                            <i class="bi bi-bag-plus me-1"></i>Agregar al Carrito
                        </button>
                        <div th:if="${tipo.cantidad == 0}" class="text-center">
                            <span class="text-muted small">Agotado</span>
                        </div>
                    </div>
                    <div th:if="${tiposTicket == null or tiposTicket.empty}" class="text-center text-muted py-4">
                        <i class="bi bi-info-circle fs-1 mb-2"></i>
                        <p class="mb-0">No hay entradas disponibles por el momento.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <a href="/eventos" class="back-btn">
            <i class="bi bi-arrow-left me-2"></i>Volver a Eventos
        </a>
    </div>
</main>

<footer th:replace="fragments/footer :: footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    function addToCart(button) {
        const tipoId = button.getAttribute('data-id');
        const precio = button.getAttribute('data-precio');
        const nombre = button.getAttribute('data-nombre');

        // Mock add to cart - in real implementation, send to backend
        button.innerHTML = '<i class="bi bi-check-circle me-1"></i>Agregado';
        button.disabled = true;
        button.classList.remove('btn-add-cart');
        button.classList.add('btn-success');

        // Show success message
        showToast('Entrada agregada al carrito', 'success');

        // In a real app, redirect to cart or update cart count
        setTimeout(() => {
            window.location.href = '/carrito';
        }, 1500);
    }

    function showToast(message, type) {
        // Create toast container if it doesn't exist
        let toastContainer = document.querySelector('.toast-container');
        if (!toastContainer) {
            toastContainer = document.createElement('div');
            toastContainer.className = 'toast-container position-fixed top-0 end-0 p-3';
            document.body.appendChild(toastContainer);
        }

        const toast = document.createElement('div');
        toast.className = `toast align-items-center text-white bg-${type} border-0`;
        toast.setAttribute('role', 'alert');
        toast.innerHTML = `
            <div class="d-flex">
                <div class="toast-body">${message}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        `;

        toastContainer.appendChild(toast);
        const bsToast = new bootstrap.Toast(toast);
        bsToast.show();

        toast.addEventListener('hidden.bs.toast', () => {
            toast.remove();
        });
    }
</script>
</body>
</html>
