<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin/fragments/head :: head('Usuarios del Sistema')"></head>
<body>
<div class="d-flex">
  <nav th:replace="admin/fragments/sidebar :: sidebar('usuarios')"></nav>
  <main class="flex-grow-1 bg-body-tertiary" style="min-height:100vh;">
    <header th:replace="admin/fragments/topbar :: topbar('Usuarios del Sistema')"></header>
    <div class="container-fluid p-4">

      <!-- Encabezado -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h2 class="h5 mb-0">Usuarios del Sistema</h2>
          <small class="text-muted">Gestiona los usuarios y sus permisos</small>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalForm">Nuevo Usuario</button>
      </div>

      <!-- Tabla -->
      <div class="card shadow-sm">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead class="table-light">
              <tr>
                <th>Usuario</th>
                <th>Correo</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Nivel</th>
                <th>Puntos</th>
                <th>Acciones</th>
              </tr>
              </thead>
              <tbody>
                <!-- Ejemplo de fila 1 -->
                <tr>
                  <td>
                    <div class="d-flex align-items-center">
                      <div class="avatar bg-secondary-subtle text-secondary me-2">JP</div>Juan Pérez
                    </div>
                  </td>
                  <td>juan.perez@email.com</td>
                  <td>Organizador</td>
                  <td><span class="badge text-bg-info">ACTIVO</span></td>
                  <td>5</td>
                  <td>1250</td>
                  <td class="d-flex">
                    <button class="btn btn-sm btn-outline-secondary me-2" data-bs-toggle="modal" data-bs-target="#modalForm">✏️</button>
                    <!-- Formulario eliminar -->
                    <form th:action="@{|/admin/usuarios/1/eliminar|}" method="post" class="d-inline">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                      <button type="submit" class="btn btn-sm btn-outline-danger">🗑️</button>
                    </form>
                  </td>
                </tr>

                <!-- Ejemplo de fila 2 -->
                <tr>
                  <td>
                    <div class="d-flex align-items-center">
                      <div class="avatar bg-secondary-subtle text-secondary me-2">AT</div>Ana Torres
                    </div>
                  </td>
                  <td>ana.torres@email.com</td>
                  <td>Organizador</td>
                  <td><span class="badge text-bg-danger">BLOQUEADO</span></td>
                  <td>4</td>
                  <td>890</td>
                  <td class="d-flex">
                    <button class="btn btn-sm btn-outline-secondary me-2" data-bs-toggle="modal" data-bs-target="#modalForm">✏️</button>
                    <!-- Formulario eliminar -->
                    <form th:action="@{|/admin/usuarios/2/eliminar|}" method="post" class="d-inline">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                      <button type="submit" class="btn btn-sm btn-outline-danger">🗑️</button>
                    </form>
                  </td>
                </tr>

              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Modal Formulario -->
      <div class="modal fade" id="modalForm" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
          <div class="modal-content">
            <!-- Formulario principal -->
            <form th:action="@{/admin/usuarios}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <input type="hidden" name="id" th:value="${usuario?.id}" />

              <div class="modal-header">
                <h5 class="modal-title">Nuevo / Editar Usuario</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>

              <div class="modal-body">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Nombre</label>
                    <input name="nombre" class="form-control" required th:value="${usuario?.nombre}" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Apellido</label>
                    <input name="apellido" class="form-control" required th:value="${usuario?.apellido}" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">DNI</label>
                    <input name="dni" class="form-control" maxlength="8" pattern="^[0-9]{8}$" required th:value="${usuario?.dni}" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Correo</label>
                    <input name="email" type="email" class="form-control" required th:value="${usuario?.email}" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Username</label>
                    <input name="username" class="form-control" required th:value="${usuario?.username}" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Teléfono</label>
                    <input name="telefono" class="form-control" th:value="${usuario?.telefono}" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Estado</label>
                    <select name="estado" class="form-select" required>
                      <option th:selected="${usuario?.estado} == 'ACTIVO'">ACTIVO</option>
                      <option th:selected="${usuario?.estado} == 'BLOQUEADO'">BLOQUEADO</option>
                      <option th:selected="${usuario?.estado} == 'BANEADO'">BANEADO</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Roles</label>
                    <select name="roles" class="form-select" multiple required>
                      <option>Administrador</option>
                      <option>Organizador Básico</option>
                      <option>Organizador Premium</option>
                      <option>Usuario</option>
                    </select>
                  </div>
                </div>
              </div>

              <div class="modal-footer">
                <button class="btn btn-outline-secondary" data-bs-dismiss="modal" type="button">Cancelar</button>
                <button class="btn btn-primary" type="submit">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<th:block th:replace="admin/fragments/scripts :: scripts"></th:block>
</body>
</html>
