<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="topbar(pageTitle)">
<header class="border-bottom bg-white">
  <div class="container-fluid py-2">
    <div class="d-flex align-items-center justify-content-between">
      <div>
        <h1 class="h5 mb-0" th:text="${pageTitle}">Panel</h1>
        <small class="text-muted">Administra usuarios, roles, categorías y más</small>
      </div>
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-outline-secondary btn-sm" id="toggleDarkMode" type="button">Modo Oscuro</button>
        <div class="d-flex align-items-center">
          <div class="avatar bg-primary-subtle text-primary fw-semibold me-2">AD</div>
          <div class="small">
            <div class="fw-semibold">Admin</div>
            <div class="text-muted">admin@eventos.com</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
</body>
</html>
