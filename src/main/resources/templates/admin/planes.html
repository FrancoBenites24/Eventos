<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin/fragments/head :: head('Planes de Suscripción')"></head>
<body>
<div class="d-flex">
  <nav th:replace="admin/fragments/sidebar :: sidebar('planes')"></nav>

  <main class="flex-grow-1 bg-body-tertiary" style="min-height:100vh;">
    <header th:replace="admin/fragments/topbar :: topbar('Planes de Suscripción')"></header>

    <div class="container-fluid p-4">

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h2 class="h5 mb-0">Planes de Suscripción</h2>
          <small class="text-muted">Administra los planes</small>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalForm">Nuevo Plan</button>
      </div>

      <!-- Toasts -->
      <div aria-live="polite" aria-atomic="true" class="position-relative">
        <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index:1080">
          <div class="toast align-items-center text-bg-success border-0" role="alert"
               aria-live="assertive" aria-atomic="true" th:if="${toastSuccess}">
            <div class="d-flex">
              <div class="toast-body" th:text="${toastSuccess}">Operación exitosa.</div>
              <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
          </div>
          <div class="toast align-items-center text-bg-danger border-0" role="alert"
               aria-live="assertive" aria-atomic="true" th:if="${toastError}">
            <div class="d-flex">
              <div class="toast-body" th:text="${toastError}">Ocurrió un error.</div>
              <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
          </div>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead class="table-light">
              <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Precio Mensual</th>
                <th>Características</th>
                <th>Suscriptores</th>
                <th>Estado</th>
                <th class="text-nowrap">Acciones</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="p : ${planes}">
                <td><span class="badge text-bg-light" th:text="${p.codigo}">COD</span></td>
                <td th:text="${p.nombre}">Nombre</td>

                <!-- centavos → S/ con 2 decimales -->
                <td th:text="${'S/ ' + #numbers.formatDecimal(p.montoMensualCentavos / 100.0, 1, 2)}">S/ 0.00</td>

                <!-- Render de badges desde JSON en el cliente -->
                <td>
                  <div class="d-flex gap-2 flex-wrap caract-badges"
                       th:attr="data-caracteristicas=${p.caracteristicas}"></div>
                </td>

                <!-- si no tienes tabla de suscriptores aún, deja guion -->
                <td>—</td>

                <td>
                  <span class="badge"
                        th:classappend="${p.activo} ? ' text-bg-info' : ' text-bg-secondary'"
                        th:text="${p.activo} ? 'ACTIVO' : 'INACTIVO'">ACTIVO</span>
                </td>

                <td class="d-flex">
                  <button class="btn btn-sm btn-outline-secondary me-2"
                          data-bs-toggle="modal" data-bs-target="#modalForm"
                          th:attr="data-id=${p.id},
                                   data-codigo=${p.codigo},
                                   data-nombre=${p.nombre},
                                   data-precio=${p.montoMensualCentavos / 100.0},
                                   data-caracteristicas=${p.caracteristicas},
                                   data-activo=${p.activo}">✏️</button>

                  <form th:action="@{|/admin/planes/${p.id}/eliminar|}" method="post" class="d-inline"
                        onsubmit="return confirm('¿Eliminar plan?');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button class="btn btn-sm btn-outline-danger" type="submit">🗑️</button>
                  </form>
                </td>
              </tr>

              <tr th:if="${#lists.isEmpty(planes)}">
                <td colspan="7" class="text-center text-muted">No hay planes registrados.</td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Modal -->
      <div class="modal fade" id="modalForm" tabindex="-1">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <form th:action="@{/admin/planes}" method="post" id="planForm">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <input type="hidden" name="id"/>

              <div class="modal-header">
                <h5 class="modal-title">Nuevo / Editar Plan</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>

              <div class="modal-body">
                <div class="row g-3">
                  <div class="col-md-4">
                    <label class="form-label">Código</label>
                    <input name="codigo" class="form-control" maxlength="40" required/>
                  </div>
                  <div class="col-md-8">
                    <label class="form-label">Nombre</label>
                    <input name="nombre" class="form-control" maxlength="80" required/>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Monto Mensual (S/)</label>
                    <input name="precioMensual" type="number" class="form-control" min="0" step="0.01" required/>
                  </div>
                  <div class="col-md-8">
                    <label class="form-label">Características (JSON)</label>
                    <textarea name="caracteristicasJson" class="form-control" rows="4"
                              placeholder='{"max_eventos":5,"asistentes":100,"soporte":"Email"}' required></textarea>
                    <div class="form-text">Escribe un JSON válido. Se mostrará como chips.</div>
                  </div>
                  <div class="col-12 form-check form-switch mt-2">
                    <input name="activo" class="form-check-input" type="checkbox" id="planActivo" checked/>
                    <label for="planActivo" class="form-check-label">Activo</label>
                  </div>
                </div>
              </div>

              <div class="modal-footer">
                <button class="btn btn-outline-secondary" data-bs-dismiss="modal" type="button">Cancelar</button>
                <button class="btn btn-primary" type="submit">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<th:block th:replace="admin/fragments/scripts :: scripts"></th:block>

<script>
// Renderiza las características JSON como badges
function renderBadges() {
  document.querySelectorAll('.caract-badges').forEach(c => {
    c.innerHTML = '';
    const raw = c.getAttribute('data-caracteristicas') || '{}';
    try {
      const obj = JSON.parse(raw);
      Object.entries(obj).forEach(([k, v]) => {
        const span = document.createElement('span');
        span.className = 'badge rounded-pill text-bg-light';
        span.textContent = (typeof v === 'object') ? `${k}` : `${v}`;
        c.appendChild(span);
      });
    } catch(e) {
      const bad = document.createElement('span');
      bad.className = 'badge rounded-pill text-bg-danger';
      bad.textContent = 'JSON inválido';
      c.appendChild(bad);
    }
  });
}

// Precarga modal (editar / nuevo)
document.addEventListener('show.bs.modal', function (ev) {
  if (ev.target.id !== 'modalForm') return;
  const btn = ev.relatedTarget;
  const form = document.getElementById('planForm');
  if (!form) return;

  if (!btn || !btn.getAttribute('data-id')) {
    form.reset();
    form.querySelector('input[name="id"]').value = '';
    form.querySelector('#planActivo').checked = true;
    return;
  }
  form.querySelector('input[name="id"]').value = btn.getAttribute('data-id') || '';
  form.querySelector('input[name="codigo"]').value = btn.getAttribute('data-codigo') || '';
  form.querySelector('input[name="nombre"]').value = btn.getAttribute('data-nombre') || '';
  form.querySelector('input[name="precioMensual"]').value = btn.getAttribute('data-precio') || '';
  form.querySelector('textarea[name="caracteristicasJson"]').value = btn.getAttribute('data-caracteristicas') || '{}';
  form.querySelector('#planActivo').checked = (btn.getAttribute('data-activo') === 'true');
});

// Valida JSON al enviar
document.addEventListener('DOMContentLoaded', function () {
  renderBadges();

  const form = document.getElementById('planForm');
  if (!form) return;
  form.addEventListener('submit', function (e) {
    const txt = form.querySelector('textarea[name="caracteristicasJson"]').value.trim();
    try { JSON.parse(txt); }
    catch (err) {
      e.preventDefault();
      alert('El campo "Características (JSON)" no contiene un JSON válido.');
    }
  });

  // Mostrar toasts si existen
  document.querySelectorAll('.toast').forEach(t => new bootstrap.Toast(t).show());
});
</script>
</body>
</html>
