<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin/fragments/head :: head('Suscripciones Activas')"></head>
<body>
<div class="d-flex">
  <nav th:replace="admin/fragments/sidebar :: sidebar('suscripciones')"></nav>
  <main class="flex-grow-1 bg-body-tertiary" style="min-height:100vh;">
    <header th:replace="admin/fragments/topbar :: topbar('Suscripciones Activas')"></header>
    <div class="container-fluid p-4">

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h2 class="h5 mb-0">Suscripciones Activas</h2>
          <small class="text-muted">Monitorea los planes</small>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalForm">Nueva Suscripción</button>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead class="table-light">
                <tr><th>Organizador</th><th>Plan</th><th>Estado</th><th>Periodo</th><th>Monto</th><th>Acciones</th></tr>
              </thead>
              <tbody>
                <!-- Fila ejemplo 1 -->
                <tr>
                  <td>
                    <div class="d-flex align-items-center">
                      <div class="avatar bg-secondary-subtle text-secondary me-2">JP</div>
                      Juan Pérez<br><small class="text-muted">juan.perez@email.com</small>
                    </div>
                  </td>
                  <td>Plan Profesional</td>
                  <td><span class="badge text-bg-info">ACTIVA</span></td>
                  <td>14/1/2025 - 14/2/2025</td>
                  <td>S/ 79.99</td>
                  <td class="d-flex">
                    <button class="btn btn-sm btn-outline-secondary me-2"
                            data-bs-toggle="modal" data-bs-target="#modalForm"
                            data-id="1"
                            data-usuario-id="101"
                            data-plan-id="PRO"
                            data-estado="ACTIVA"
                            data-monto="79.99"
                            data-inicio="2025-01-14"
                            data-fin="2025-02-14">✏️</button>
                    <form th:action="@{|/admin/suscripciones/1/eliminar|}" method="post" class="d-inline">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                      <button type="submit" class="btn btn-sm btn-outline-danger">🗑️</button>
                    </form>
                  </td>
                </tr>

                <!-- Fila ejemplo 2 -->
                <tr>
                  <td>
                    <div class="d-flex align-items-center">
                      <div class="avatar bg-secondary-subtle text-secondary me-2">CR</div>
                      Carlos Ruiz<br><small class="text-muted">carlos.ruiz@email.com</small>
                    </div>
                  </td>
                  <td>Plan Básico</td>
                  <td><span class="badge text-bg-danger">IMPAGA</span></td>
                  <td>9/6/2025 - 9/7/2025</td>
                  <td>S/ 29.99</td>
                  <td class="d-flex">
                    <button class="btn btn-sm btn-outline-secondary me-2"
                            data-bs-toggle="modal" data-bs-target="#modalForm"
                            data-id="2"
                            data-usuario-id="102"
                            data-plan-id="BAS"
                            data-estado="IMPAGA"
                            data-monto="29.99"
                            data-inicio="2025-06-09"
                            data-fin="2025-07-09">✏️</button>
                    <form th:action="@{|/admin/suscripciones/2/eliminar|}" method="post" class="d-inline">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                      <button type="submit" class="btn btn-sm btn-outline-danger">🗑️</button>
                    </form>
                  </td>
                </tr>

                <!--
                Versión dinámica con Thymeleaf:
                <tr th:each="s : ${suscripciones}">
                  <td>
                    <div class="d-flex align-items-center">
                      <div class="avatar bg-secondary-subtle text-secondary me-2"
                           th:text="${s.inicialesUsuario}">US</div>
                      <span th:text="${s.nombreUsuario}">Nombre</span><br>
                      <small class="text-muted" th:text="${s.emailUsuario}">email@dominio.com</small>
                    </div>
                  </td>
                  <td th:text="${s.planNombre}">Plan</td>
                  <td>
                    <span class="badge"
                          th:classappend="${s.estado}=='ACTIVA' ? ' text-bg-info' :
                                          (${s.estado}=='IMPAGA' ? ' text-bg-danger' : ' text-bg-secondary')"
                          th:text="${s.estado}">ACTIVA</span>
                  </td>
                  <td>
                    <span th:text="${#temporals.format(s.inicio,'d/M/yyyy')}">01/01/2025</span> -
                    <span th:text="${#temporals.format(s.fin,'d/M/yyyy')}">01/02/2025</span>
                  </td>
                  <td th:text="${'S/ ' + #numbers.formatDecimal(s.monto,1,2)}">S/ 0.00</td>
                  <td class="d-flex">
                    <button class="btn btn-sm btn-outline-secondary me-2"
                            data-bs-toggle="modal" data-bs-target="#modalForm"
                            th:attr="data-id=${s.id},data-usuario-id=${s.usuarioId},data-plan-id=${s.planCodigo},
                                     data-estado=${s.estado},data-monto=${s.monto},
                                     data-inicio=${#temporals.format(s.inicio,'yyyy-MM-dd')},
                                     data-fin=${#temporals.format(s.fin,'yyyy-MM-dd')}">✏️</button>
                    <form th:action="@{|/admin/suscripciones/${s.id}/eliminar|}" method="post" class="d-inline">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                      <button type="submit" class="btn btn-sm btn-outline-danger">🗑️</button>
                    </form>
                  </td>
                </tr>
                -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Modal -->
      <div class="modal fade" id="modalForm" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <form th:action="@{/admin/suscripciones}" method="post" id="susForm">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <input type="hidden" name="id" th:value="${suscripcion?.id}" />

              <div class="modal-header">
                <h5 class="modal-title">Nueva / Editar Suscripción</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>

              <div class="modal-body">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Usuario</label>
                    <select name="usuarioId" class="form-select" required>
                      <option value="">— Seleccionar —</option>
                      <option value="101">Juan Pérez</option>
                      <option value="102">Carlos Ruiz</option>
                      <!-- Dinámico:
                      <option th:each="u: ${usuarios}" th:value="${u.id}" th:text="${u.nombreCompleto}"></option>
                      -->
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Plan</label>
                    <select name="planCodigo" class="form-select" required>
                      <option value="">— Seleccionar —</option>
                      <option value="BAS">Plan Básico</option>
                      <option value="PRO">Plan Profesional</option>
                      <!-- Dinámico:
                      <option th:each="p: ${planes}" th:value="${p.codigo}" th:text="${p.nombre}"></option>
                      -->
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Estado</label>
                    <select name="estado" class="form-select" required>
                      <option>ACTIVA</option>
                      <option>IMPAGA</option>
                      <option>CANCELADA</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Monto (S/)</label>
                    <input name="monto" type="number" class="form-control" min="0" step="0.01" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Inicio</label>
                    <input name="inicio" type="date" class="form-control" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Fin</label>
                    <input name="fin" type="date" class="form-control" required />
                  </div>
                </div>
              </div>

              <div class="modal-footer">
                <button class="btn btn-outline-secondary" data-bs-dismiss="modal" type="button">Cancelar</button>
                <button class="btn btn-primary" type="submit">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<th:block th:replace="admin/fragments/scripts :: scripts"></th:block>

<!-- (Opcional) Precarga de datos al editar -->
<script>
document.addEventListener('show.bs.modal', function (ev) {
  if (ev.target.id !== 'modalForm') return;
  const btn = ev.relatedTarget;
  const form = document.getElementById('susForm');
  if (!btn || !form) return;

  // Nuevo => limpiar
  if (!btn.getAttribute('data-id')) {
    form.reset();
    form.querySelector('input[name="id"]').value = '';
    return;
  }

  // Editar => precargar
  form.querySelector('input[name="id"]').value = btn.getAttribute('data-id') || '';
  form.querySelector('select[name="usuarioId"]').value = btn.getAttribute('data-usuario-id') || '';
  form.querySelector('select[name="planCodigo"]').value = btn.getAttribute('data-plan-id') || '';
  form.querySelector('select[name="estado"]').value = btn.getAttribute('data-estado') || 'ACTIVA';
  form.querySelector('input[name="monto"]').value = btn.getAttribute('data-monto') || '';
  form.querySelector('input[name="inicio"]').value = btn.getAttribute('data-inicio') || '';
  form.querySelector('input[name="fin"]').value = btn.getAttribute('data-fin') || '';
});
</script>
</body>
</html>
