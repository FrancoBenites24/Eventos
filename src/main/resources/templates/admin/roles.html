<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin/fragments/head :: head('Roles del Sistema')"></head>
<body>
<div class="d-flex">
  <nav th:replace="admin/fragments/sidebar :: sidebar('roles')"></nav>
  <main class="flex-grow-1 bg-body-tertiary" style="min-height:100vh;">
    <header th:replace="admin/fragments/topbar :: topbar('Roles del Sistema')"></header>
    <div class="container-fluid p-4">

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h2 class="h5 mb-0">Roles del Sistema</h2>
          <small class="text-muted">Define permisos por rol</small>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalForm"
                data-id="" data-nombre="" data-permisos="">
          Nuevo Rol
        </button>
      </div>

      <!-- Toasts -->
      <div aria-live="polite" aria-atomic="true" class="position-relative">
        <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index:1080">
          <div class="toast text-bg-success" th:if="${toastSuccess}">
            <div class="d-flex">
              <div class="toast-body" th:text="${toastSuccess}">OK</div>
              <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
          </div>
          <div class="toast text-bg-danger" th:if="${toastDanger}">
            <div class="d-flex">
              <div class="toast-body" th:text="${toastDanger}">Error</div>
              <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
          </div>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead class="table-light">
              <tr>
                <th>Rol</th>
                <th>Usuarios</th>
                <th>Permisos</th>
                <th>Creado</th>
                <th>Acciones</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="r : ${roles}">
                <td th:text="${r.nombre}">—</td>
                <td th:text="${r.usuarioRoles != null ? #lists.size(r.usuarioRoles) : 0}">0</td>
                <td th:text="${r.permisos != null ? #lists.size(r.permisos) : 0}">0</td>
                <td th:text="${#temporals.format(r.creadoEn, 'dd/MM/yyyy')}">—</td>
                <td class="d-flex">
                  <button class="btn btn-sm btn-outline-secondary me-2"
                          data-bs-toggle="modal" data-bs-target="#modalForm"
                          th:attr="data-id=${r.id},
                                   data-nombre=${r.nombre},
                                   data-permisos=${r.permisos != null ? #strings.listJoin(r.permisos.![id], ',') : ''}">
                    ✏️
                  </button>
                  <form th:action="@{|/admin/roles/${r.id}/eliminar|}" method="post" class="d-inline"
                        onsubmit="return confirm('¿Eliminar rol?');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-sm btn-outline-danger">🗑️</button>
                  </form>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(roles)}">
                <td colspan="5" class="text-center text-muted">No hay roles registrados.</td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Modal Crear/Editar -->
      <div class="modal fade" id="modalForm" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <form th:action="@{/admin/roles}" method="post" th:object="${rolForm}">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <input type="hidden" name="id" th:field="*{id}"/>

              <div class="modal-header">
                <h5 class="modal-title">Rol</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>

              <div class="modal-body">
                <div class="mb-3">
                  <label class="form-label">Nombre</label>
                  <input class="form-control" maxlength="20" required th:field="*{nombre}"/>
                  <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('nombre')}"
                       th:errors="*{nombre}">Error</div>
                </div>

                <div class="mb-3">
                  <label class="form-label">Permisos</label>
                  <select class="form-select" multiple th:field="*{permisosIds}">
                    <option th:each="p: ${permisos}" th:value="${p.id}" th:text="${p.codigo}">PERM</option>
                  </select>
                </div>
              </div>

              <div class="modal-footer">
                <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-primary" type="submit">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<th:block th:replace="admin/fragments/scripts :: scripts"></th:block>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // Autodisparar toasts si existen
  document.querySelectorAll('.toast').forEach(t => new bootstrap.Toast(t).show());

  // Pre-carga del modal para editar
  const modalEl = document.getElementById('modalForm');
  modalEl.addEventListener('show.bs.modal', (ev) => {
    const btn = ev.relatedTarget;
    if (!btn) return;
    const id = btn.getAttribute('data-id') || '';
    const nombre = btn.getAttribute('data-nombre') || '';
    const permisosCsv = btn.getAttribute('data-permisos') || '';
    const form = modalEl.querySelector('form');

    // Resetea
    form.reset();
    form.querySelector('input[name="id"]').value = id;
    form.querySelector('input[name="nombre"]').value = nombre;

    // Selecciona permisos en el <select multiple>
    const select = form.querySelector('select[name="permisosIds"]');
    const set = new Set(permisosCsv.split(',').filter(Boolean));
    for (const opt of select.options) {
      opt.selected = set.has(opt.value);
    }
  });
});
</script>
</body>
</html>
