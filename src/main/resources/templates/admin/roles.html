<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin/fragments/head :: head('Roles del Sistema')"></head>
<body>
<div class="d-flex">
  <nav th:replace="admin/fragments/sidebar :: sidebar('roles')"></nav>
  <main class="flex-grow-1 bg-body-tertiary" style="min-height:100vh;">
    <header th:replace="admin/fragments/topbar :: topbar('Roles del Sistema')"></header>
    <div class="container-fluid p-4">

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h2 class="h5 mb-0">Roles del Sistema</h2>
          <small class="text-muted">Define permisos por rol</small>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalForm">Nuevo Rol</button>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead class="table-light">
                <tr>
                  <th>Rol</th><th>Descripción</th><th>Usuarios</th><th>Permisos</th><th>Creado</th><th>Acciones</th>
                </tr>
              </thead>
              <tbody>
                <!-- Ejemplo fila 1 -->
                <tr>
                  <td>Administrador</td>
                  <td>Control total del sistema</td>
                  <td>3</td>
                  <td>45</td>
                  <td>31/12/2023</td>
                  <td class="d-flex">
                    <button class="btn btn-sm btn-outline-secondary me-2" data-bs-toggle="modal" data-bs-target="#modalForm">✏️</button>
                    <!-- Eliminar -->
                    <form th:action="@{|/admin/roles/1/eliminar|}" method="post" class="d-inline">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                      <button type="submit" class="btn btn-sm btn-outline-danger">🗑️</button>
                    </form>
                  </td>
                </tr>

                <!-- Ejemplo fila 2 -->
                <tr>
                  <td>Organizador Premium</td>
                  <td>Crear y gestionar eventos premium</td>
                  <td>128</td>
                  <td>25</td>
                  <td>31/12/2023</td>
                  <td class="d-flex">
                    <button class="btn btn-sm btn-outline-secondary me-2" data-bs-toggle="modal" data-bs-target="#modalForm">✏️</button>
                    <!-- Eliminar -->
                    <form th:action="@{|/admin/roles/2/eliminar|}" method="post" class="d-inline">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                      <button type="submit" class="btn btn-sm btn-outline-danger">🗑️</button>
                    </form>
                  </td>
                </tr>

                <!--
                Cuando lo hagas dinámico:
                <tr th:each="r : ${roles}">
                  <td th:text="${r.nombre}">—</td>
                  <td th:text="${r.descripcion}">—</td>
                  <td th:text="${r.totalUsuarios}">0</td>
                  <td th:text="${r.totalPermisos}">0</td>
                  <td th:text="${#temporals.format(r.creado, 'dd/MM/yyyy')}">—</td>
                  <td class="d-flex">
                    <button class="btn btn-sm btn-outline-secondary me-2" data-bs-toggle="modal"
                            data-bs-target="#modalForm"
                            th:attr="data-id=${r.id},data-nombre=${r.nombre},data-desc=${r.descripcion}">
                      ✏️
                    </button>
                    <form th:action="@{|/admin/roles/${r.id}/eliminar|}" method="post" class="d-inline">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                      <button type="submit" class="btn btn-sm btn-outline-danger">🗑️</button>
                    </form>
                  </td>
                </tr>
                -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Modal -->
      <div class="modal fade" id="modalForm" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <!-- Form crear/editar rol -->
            <form th:action="@{/admin/roles}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <!-- Para editar, rellena este hidden con el ID -->
              <input type="hidden" name="id" th:value="${rol?.id}" />

              <div class="modal-header">
                <h5 class="modal-title">Nuevo / Editar Rol</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>

              <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input name="nombre" class="form-control" maxlength="30" required th:value="${rol?.nombre}" />
                </div>

                <!-- (Opcional) Descripción, ya que la tabla la muestra -->
                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <input name="descripcion" class="form-control" maxlength="120" th:value="${rol?.descripcion}" />
                </div>

                <div class="mb-3">
                  <label class="form-label">Permisos</label>
                  <select name="permisos" class="form-select" multiple>
                    <option>EVT_CREAR</option>
                    <option>EVT_EDITAR</option>
                    <option>EVT_ELIMINAR</option>
                    <option>USR_VER</option>
                  </select>
                  <!-- Cuando sea dinámico:
                  <select name="permisos" class="form-select" multiple>
                    <option th:each="p: ${permisos}"
                            th:value="${p.codigo}"
                            th:text="${p.codigo}"
                            th:selected="${rol != null} ? ${rol.tienePermiso(p)} : false">
                    </option>
                  </select>
                  -->
                </div>
              </div>

              <div class="modal-footer">
                <button class="btn btn-outline-secondary" data-bs-dismiss="modal" type="button">Cancelar</button>
                <button class="btn btn-primary" type="submit">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<th:block th:replace="admin/fragments/scripts :: scripts"></th:block>

<!-- (Opcional) Script para precargar el modal al editar, si pasas data-* en el botón -->
<script>
// Si luego quieres precargar datos del rol al abrir el modal de edición:
document.addEventListener('show.bs.modal', function (ev) {
  if (ev.target.id !== 'modalForm') return;
  const btn = ev.relatedTarget;
  if (!btn) return;
  // Ejemplo si usas data-* en el botón:
  // const id = btn.getAttribute('data-id');
  // const nombre = btn.getAttribute('data-nombre');
  // const desc = btn.getAttribute('data-desc');
  // document.querySelector('#modalForm input[name="id"]').value = id || '';
  // document.querySelector('#modalForm input[name="nombre"]').value = nombre || '';
  // document.querySelector('#modalForm input[name="descripcion"]').value = desc || '';
});
</script>
</body>
</html>
