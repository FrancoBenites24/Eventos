<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin/fragments/head :: head('Categorías de Eventos')"></head>
<body>
<div class="d-flex">
  <nav th:replace="admin/fragments/sidebar :: sidebar('categorias')"></nav>
  <main class="flex-grow-1 bg-body-tertiary" style="min-height:100vh;">
    <header th:replace="admin/fragments/topbar :: topbar('Categorías de Eventos')"></header>
    <div class="container-fluid p-4">

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h2 class="h5 mb-0">Categorías de Eventos</h2>
          <small class="text-muted">Administra las categorías</small>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalForm">Nueva Categoría</button>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead class="table-light">
                <tr><th>Categoría</th><th>Eventos Totales</th><th>Acciones</th></tr>
              </thead>
              <tbody>
                <!-- Ejemplo fila 1 -->
                <tr>
                  <td>
                    <div class="d-flex align-items-center">
                      <span class="me-2">🎵</span>Música
                    </div>
                  </td>
                  <td>345</td>
                  <td class="d-flex">
                    <button class="btn btn-sm btn-outline-secondary me-2"
                            data-bs-toggle="modal" data-bs-target="#modalForm"
                            data-id="1" data-nombre="Música">✏️</button>
                    <form th:action="@{|/admin/categorias/1/eliminar|}" method="post" class="d-inline">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                      <button class="btn btn-sm btn-outline-danger" type="submit">🗑️</button>
                    </form>
                  </td>
                </tr>

                <!-- Ejemplo fila 2 -->
                <tr>
                  <td>
                    <div class="d-flex align-items-center">
                      <span class="me-2">💻</span>Tecnología
                    </div>
                  </td>
                  <td>280</td>
                  <td class="d-flex">
                    <button class="btn btn-sm btn-outline-secondary me-2"
                            data-bs-toggle="modal" data-bs-target="#modalForm"
                            data-id="2" data-nombre="Tecnología">✏️</button>
                    <form th:action="@{|/admin/categorias/2/eliminar|}" method="post" class="d-inline">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                      <button class="btn btn-sm btn-outline-danger" type="submit">🗑️</button>
                    </form>
                  </td>
                </tr>

                <!--
                Versión dinámica con Thymeleaf:
                <tr th:each="c : ${categorias}">
                  <td>
                    <div class="d-flex align-items-center">
                      <span class="me-2" th:text="${c.emoji != null ? c.emoji : '🏷️'}">🏷️</span>
                      <span th:text="${c.nombre}">Nombre</span>
                    </div>
                  </td>
                  <td th:text="${c.totalEventos}">0</td>
                  <td class="d-flex">
                    <button class="btn btn-sm btn-outline-secondary me-2"
                            data-bs-toggle="modal" data-bs-target="#modalForm"
                            th:attr="data-id=${c.id},data-nombre=${c.nombre}">✏️</button>
                    <form th:action="@{|/admin/categorias/${c.id}/eliminar|}" method="post" class="d-inline">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                      <button class="btn btn-sm btn-outline-danger" type="submit">🗑️</button>
                    </form>
                  </td>
                </tr>
                -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Modal Crear/Editar -->
      <div class="modal fade" id="modalForm" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <form th:action="@{/admin/categorias}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <input type="hidden" name="id" th:value="${categoria?.id}" />

              <div class="modal-header">
                <h5 class="modal-title">Nueva / Editar Categoría</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>

              <div class="modal-body">
                <div class="mb-3">
                  <label class="form-label">Nombre</label>
                  <input name="nombre" class="form-control" maxlength="30" required th:value="${categoria?.nombre}" />
                </div>
                <!-- (Opcional) Emoji/Ícono -->
                <!--
                <div class="mb-3">
                  <label class="form-label">Ícono (emoji)</label>
                  <input name="emoji" class="form-control" maxlength="2" th:value="${categoria?.emoji}" placeholder="🎵" />
                </div>
                -->
              </div>

              <div class="modal-footer">
                <button class="btn btn-outline-secondary" data-bs-dismiss="modal" type="button">Cancelar</button>
                <button class="btn btn-primary" type="submit">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<th:block th:replace="admin/fragments/scripts :: scripts"></th:block>

<!-- (Opcional) Precargar datos en el modal de edición -->
<script>
document.addEventListener('show.bs.modal', function (ev) {
  if (ev.target.id !== 'modalForm') return;
  const btn = ev.relatedTarget;
  if (!btn) return;
  const id = btn.getAttribute('data-id') || '';
  const nombre = btn.getAttribute('data-nombre') || '';
  const form = document.querySelector('#modalForm form');
  if (!form) return;
  form.querySelector('input[name="id"]').value = id;
  form.querySelector('input[name="nombre"]').value = nombre;
});
</script>
</body>
</html>
