<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin/fragments/head :: head('Categor&iacute;as de Eventos')"></head>
<body>
<div class="d-flex">
  <nav th:replace="admin/fragments/sidebar :: sidebar('categorias')"></nav>

  <main class="flex-grow-1 bg-body-tertiary" style="min-height:100vh;">
    <header th:replace="admin/fragments/topbar :: topbar('Categor&iacute;as de Eventos')"></header>

    <div class="container-fluid p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h2 class="h5 mb-0">Categor&iacute;as de Eventos</h2>
          <small class="text-muted">Administra las categor&iacute;as que se muestran al crear eventos</small>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalForm">Nueva Categor&iacute;a</button>
      </div>

      <div aria-live="polite" aria-atomic="true" class="position-relative">
        <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index:1080">
          <div class="toast align-items-center text-bg-success border-0" role="alert"
               aria-live="assertive" aria-atomic="true" th:if="${toastSuccess}">
            <div class="d-flex">
              <div class="toast-body" th:text="${toastSuccess}">Operaci&oacute;n exitosa.</div>
              <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
          </div>
          <div class="toast align-items-center text-bg-danger border-0" role="alert"
               aria-live="assertive" aria-atomic="true" th:if="${toastError}">
            <div class="d-flex">
              <div class="toast-body" th:text="${toastError}">Ocurri&oacute; un error.</div>
              <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
          </div>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead class="table-light">
              <tr>
                <th>Nombre</th>
                <th class="text-center">Eventos totales</th>
                <th class="text-nowrap text-center">Acciones</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="c : ${categorias}">
                <td th:text="${c.nombre}">Nombre</td>
                <td class="text-center" th:text="${eventosPorCategoria[c.id]} ?: 0">0</td>
                <td class="d-flex justify-content-center">
                  <button class="btn btn-sm btn-outline-secondary me-2"
                          data-bs-toggle="modal" data-bs-target="#modalForm"
                          th:attr="data-id=${c.id},data-nombre=${c.nombre}">Editar</button>
                  <form th:action="@{|/admin/categorias/${c.id}/eliminar|}" method="post" class="d-inline"
                        onsubmit="return confirm('Eliminar la categor&iacute;a?');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                  </form>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(categorias)}">
                <td colspan="3" class="text-center text-muted">No hay categor&iacute;as registradas.</td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="modal fade" id="modalForm" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <form th:action="@{/admin/categorias}" method="post" id="categoriaForm">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <input type="hidden" name="id"/>

              <div class="modal-header">
                <h5 class="modal-title">Nueva / Editar Categor&iacute;a</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>

              <div class="modal-body">
                <div class="mb-3">
                  <label class="form-label">Nombre</label>
                  <input name="nombre" class="form-control" maxlength="30" required/>
                  <div class="form-text">Evita duplicados; se normaliza ignorando may&uacute;sculas y acentos.</div>
                </div>
              </div>

              <div class="modal-footer">
                <button class="btn btn-outline-secondary" data-bs-dismiss="modal" type="button">Cancelar</button>
                <button class="btn btn-primary" type="submit">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<th:block th:replace="admin/fragments/scripts :: scripts"></th:block>
<script>
document.addEventListener('show.bs.modal', function (ev) {
  if (ev.target.id !== 'modalForm') return;
  const btn = ev.relatedTarget;
  const form = document.getElementById('categoriaForm');
  if (!form) return;

  if (!btn || !btn.getAttribute('data-id')) {
    form.reset();
    form.querySelector('input[name="id"]').value = '';
    return;
  }

  form.querySelector('input[name="id"]').value = btn.getAttribute('data-id') || '';
  form.querySelector('input[name="nombre"]').value = btn.getAttribute('data-nombre') || '';
});

document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('.toast').forEach(t => new bootstrap.Toast(t).show());
});
</script>
</body>
</html>
