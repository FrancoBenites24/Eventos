<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin/fragments/head :: head('Permisos del Sistema')"></head>
<body>
<div class="d-flex">
  <nav th:replace="admin/fragments/sidebar :: sidebar('permisos')"></nav>
  <main class="flex-grow-1 bg-body-tertiary" style="min-height:100vh;">
    <header th:replace="admin/fragments/topbar :: topbar('Permisos del Sistema')"></header>
    <div class="container-fluid p-4">

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h2 class="h5 mb-0">Permisos del Sistema</h2>
          <small class="text-muted">Gestiona permisos disponibles</small>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalForm">Nuevo Permiso</button>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead class="table-light">
                <tr>
                  <th>Código</th>
                  <th>Descripción</th>
                  <th>Módulo</th>
                  <th>Roles Asignados</th>
                  <th>Creado</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody>
                <!-- Fila de ejemplo 1 -->
                <tr>
                  <td><span class="badge text-bg-light">EVT_CREAR</span></td>
                  <td>Crear eventos</td>
                  <td><span class="badge rounded-pill text-bg-info">Eventos</span></td>
                  <td>3</td>
                  <td>31/12/2023</td>
                  <td class="d-flex">
                    <button class="btn btn-sm btn-outline-secondary me-2"
                            data-bs-toggle="modal" data-bs-target="#modalForm"
                            data-id="1" data-codigo="EVT_CREAR" data-descripcion="Crear eventos" data-modulo="EVENTOS">✏️</button>
                    <form th:action="@{|/admin/permisos/1/eliminar|}" method="post" class="d-inline">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                      <button class="btn btn-sm btn-outline-danger" type="submit">🗑️</button>
                    </form>
                  </td>
                </tr>

                <!-- Fila de ejemplo 2 -->
                <tr>
                  <td><span class="badge text-bg-light">USR_VER</span></td>
                  <td>Ver usuarios</td>
                  <td><span class="badge rounded-pill text-bg-secondary">Usuarios</span></td>
                  <td>2</td>
                  <td>31/12/2023</td>
                  <td class="d-flex">
                    <button class="btn btn-sm btn-outline-secondary me-2"
                            data-bs-toggle="modal" data-bs-target="#modalForm"
                            data-id="2" data-codigo="USR_VER" data-descripcion="Ver usuarios" data-modulo="USUARIOS">✏️</button>
                    <form th:action="@{|/admin/permisos/2/eliminar|}" method="post" class="d-inline">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                      <button class="btn btn-sm btn-outline-danger" type="submit">🗑️</button>
                    </form>
                  </td>
                </tr>

                <!--
                Cuando lo hagas dinámico con Thymeleaf:
                <tr th:each="p : ${permisos}">
                  <td><span class="badge text-bg-light" th:text="${p.codigo}">CODIGO</span></td>
                  <td th:text="${p.descripcion}">—</td>
                  <td><span class="badge rounded-pill text-bg-info" th:text="${p.moduloNombre}">Módulo</span></td>
                  <td th:text="${p.totalRoles}">0</td>
                  <td th:text="${#temporals.format(p.creado,'dd/MM/yyyy')}">—</td>
                  <td class="d-flex">
                    <button class="btn btn-sm btn-outline-secondary me-2"
                            data-bs-toggle="modal" data-bs-target="#modalForm"
                            th:attr="data-id=${p.id},data-codigo=${p.codigo},data-descripcion=${p.descripcion},data-modulo=${p.modulo}">
                      ✏️
                    </button>
                    <form th:action="@{|/admin/permisos/${p.id}/eliminar|}" method="post" class="d-inline">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                      <button class="btn btn-sm btn-outline-danger" type="submit">🗑️</button>
                    </form>
                  </td>
                </tr>
                -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Modal Crear/Editar -->
      <div class="modal fade" id="modalForm" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <form th:action="@{/admin/permisos}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <input type="hidden" name="id" th:value="${permiso?.id}"/>

              <div class="modal-header">
                <h5 class="modal-title">Nuevo / Editar Permiso</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>

              <div class="modal-body">
                <div class="mb-3">
                  <label class="form-label">Código</label>
                  <input name="codigo" class="form-control" maxlength="50" required th:value="${permiso?.codigo}" />
                </div>
                <div class="mb-3">
                  <label class="form-label">Descripción</label>
                  <textarea name="descripcion" class="form-control" rows="3" th:text="${permiso?.descripcion}"></textarea>
                </div>

                <!-- (Opcional) Módulo, para alinearlo con la columna de la tabla -->
                <div class="mb-3">
                  <label class="form-label">Módulo</label>
                  <select name="modulo" class="form-select">
                    <option value="">— Seleccionar —</option>
                    <option value="EVENTOS">Eventos</option>
                    <option value="USUARIOS">Usuarios</option>
                    <option value="VENTAS">Ventas</option>
                    <option value="REPORTES">Reportes</option>
                  </select>
                  <!-- Dinámico:
                  <select name="modulo" class="form-select">
                    <option th:each="m: ${modulos}" th:value="${m.codigo}" th:text="${m.nombre}"
                            th:selected="${permiso != null} ? ${permiso.modulo} == ${m.codigo} : false"></option>
                  </select>
                  -->
                </div>
              </div>

              <div class="modal-footer">
                <button class="btn btn-outline-secondary" data-bs-dismiss="modal" type="button">Cancelar</button>
                <button class="btn btn-primary" type="submit">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<th:block th:replace="admin/fragments/scripts :: scripts"></th:block>

<!-- (Opcional) Precarga de datos al abrir modal en modo edición usando data-* del botón -->
<script>
document.addEventListener('show.bs.modal', function (ev) {
  if (ev.target.id !== 'modalForm') return;
  const btn = ev.relatedTarget;
  if (!btn) return;

  const id = btn.getAttribute('data-id') || '';
  const codigo = btn.getAttribute('data-codigo') || '';
  const descripcion = btn.getAttribute('data-descripcion') || '';
  const modulo = btn.getAttribute('data-modulo') || '';

  const form = document.querySelector('#modalForm form');
  if (!form) return;

  form.querySelector('input[name="id"]').value = id;
  form.querySelector('input[name="codigo"]').value = codigo;
  form.querySelector('textarea[name="descripcion"]').value = descripcion;

  const moduloSelect = form.querySelector('select[name="modulo"]');
  if (moduloSelect) moduloSelect.value = modulo;
});
</script>
</body>
</html>
