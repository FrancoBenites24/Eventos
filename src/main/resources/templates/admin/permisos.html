<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin/fragments/head :: head('Permisos del Sistema')"></head>
<body>
<div class="d-flex">
  <nav th:replace="admin/fragments/sidebar :: sidebar('permisos')"></nav>
  <main class="flex-grow-1 bg-body-tertiary" style="min-height:100vh;">
    <header th:replace="admin/fragments/topbar :: topbar('Permisos del Sistema')"></header>
    <div class="container-fluid p-4">

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h2 class="h5 mb-0">Permisos del Sistema</h2>
          <small class="text-muted">Gestiona permisos disponibles</small>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalForm">Nuevo Permiso</button>
      </div>

      <!-- Toasts -->
      <div aria-live="polite" aria-atomic="true" class="position-relative">
        <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index:1080">
          <div class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true" th:if="${toastSuccess}">
            <div class="d-flex">
              <div class="toast-body" th:text="${toastSuccess}">Operación exitosa.</div>
              <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
          </div>
          <div class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true" th:if="${toastError}">
            <div class="d-flex">
              <div class="toast-body" th:text="${toastError}">Ocurrió un error.</div>
              <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
          </div>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead class="table-light">
                <tr>
                  <th>Código</th>
                  <th>Descripción</th>
                  <th>Roles Asignados</th>
                  <th>Creado</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody>
                <tr th:if="${#lists.isEmpty(permisos)}">
                  <td colspan="5" class="text-center text-muted py-4">No hay permisos registrados.</td>
                </tr>

                <tr th:each="p : ${permisos}">
                  <td><span class="badge text-bg-light" th:text="${p.nombre}">CODIGO</span></td>
                  <td th:text="${p.descripcion}">—</td>
                  <td>—</td> <!-- TODO: contar roles asignados -->
                  <td th:text="${#temporals.format(p.creadoEn, 'dd/MM/yyyy')}">—</td>
                  <td class="d-flex">
                    <button class="btn btn-sm btn-outline-secondary me-2"
                            data-bs-toggle="modal" data-bs-target="#modalForm"
                            th:attr="data-id=${p.id},data-nombre=${p.nombre},data-descripcion=${p.descripcion}">
                      ✏️
                    </button>
                    <form th:action="@{|/admin/permisos/${p.id}/eliminar|}" method="post" class="d-inline">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                      <button class="btn btn-sm btn-outline-danger" type="submit">🗑️</button>
                    </form>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Modal Crear/Editar -->
      <div class="modal fade" id="modalForm" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <form th:action="@{/admin/permisos}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <input type="hidden" name="id"/>

              <div class="modal-header">
                <h5 class="modal-title">Nuevo / Editar Permiso</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>

              <div class="modal-body">
                <div class="mb-3">
                  <label class="form-label">Código</label>
                  <input name="nombre" class="form-control" maxlength="50" required />
                </div>
                <div class="mb-3">
                  <label class="form-label">Descripción</label>
                  <textarea name="descripcion" class="form-control" rows="3"></textarea>
                </div>
              </div>

              <div class="modal-footer">
                <button class="btn btn-outline-secondary" data-bs-dismiss="modal" type="button">Cancelar</button>
                <button class="btn btn-primary" type="submit">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<th:block th:replace="admin/fragments/scripts :: scripts"></th:block>

<script>
  // Autocargar datos al abrir modal en modo edición
  document.addEventListener('show.bs.modal', function (ev) {
    if (ev.target.id !== 'modalForm') return;
    const btn = ev.relatedTarget;
    const form = document.querySelector('#modalForm form');
    if (!btn || !form) return;

    form.querySelector('input[name="id"]').value = btn.getAttribute('data-id') || '';
    form.querySelector('input[name="nombre"]').value = btn.getAttribute('data-nombre') || '';
    form.querySelector('textarea[name="descripcion"]').value = btn.getAttribute('data-descripcion') || '';
  });

  // Mostrar toasts si existen
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.toast').forEach(t => new bootstrap.Toast(t).show());
  });
</script>
</body>
</html>
