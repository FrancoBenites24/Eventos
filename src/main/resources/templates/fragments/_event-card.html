<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="eventCard(card)">
  <article class="event-card card h-100 shadow-sm border-0">
    <div class="ratio ratio-16x9 position-relative">
      <img class="card-img-top object-fit-cover" th:src="${card.imagenUrl != null} ? ${card.imagenUrl} : @{/img/placeholder-event.jpg}" alt="Evento">
      <span class="badge position-absolute top-2 start-2 bg-dark-subtle text-dark">[[${card.categoria}]]</span>
    </div>

    <div class="card-body">
      <div class="d-flex align-items-center gap-2 small text-muted mb-1">
        <span class="date-chip">
          <span class="d-block lh-1 text-uppercase fw-bold" th:text="${#temporals.format(card.fecha,'MMM')}">NOV</span>
          <span class="d-block lh-1 fs-6 fw-semibold" th:text="${#temporals.format(card.fecha,'dd')}">15</span>
        </span>
        <div class="flex-grow-1">
          <h6 class="mb-1 line-clamp-1" th:text="${card.titulo}">Rock en Español</h6>
          <div class="small"><i class="bi bi-geo-alt me-1"></i><span th:text="${card.lugar}">Estadio Nación</span></div>
        </div>
      </div>

      <div class="d-flex align-items-center justify-content-between mt-3">
        <div class="price">S/ <span th:text="${#numbers.formatDecimal(card.precioCentavos/100.0,1,2)}">45.00</span></div>

        <button type="button"
                class="btn btn-teal btn-sm d-inline-flex align-items-center"
                data-add-to-cart
                th:attr="data-evento-id=${card.eventoId},
                         data-entrada-tipo-id=${card.entradaTipoId},
                         data-titulo=${card.titulo},
                         data-precio=${card.precioCentavos}">
          <i class="bi bi-bag-plus me-1"></i> Agregar al Carrito
        </button>
      </div>
    </div>
  </article>
</th:block>
</body>
</html>
