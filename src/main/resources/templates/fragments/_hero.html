<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="hero(destacado)">
  <section class="hero-wrap rounded-4 overflow-hidden position-relative mb-4 shadow-sm"
           th:with="imagenRaw=${destacado != null ? destacado.imagenUrl : null},
                    tieneImagen=${imagenRaw != null and !#strings.isEmpty(imagenRaw)},
                    categoriaRaw=${destacado != null ? destacado.categoria : null},
                    categoria=${categoriaRaw != null and !#strings.isEmpty(categoriaRaw) ? categoriaRaw : 'Categoria'},
                    fechaRaw=${destacado != null ? destacado.fecha : null},
                    fechaTexto=${fechaRaw != null ? #temporals.format(fechaRaw, 'dd MMM yyyy, HH:mm') : 'Por definir'},
                    lugarRaw=${destacado != null ? destacado.lugar : null},
                    lugarTexto=${lugarRaw != null and !#strings.isEmpty(lugarRaw) ? lugarRaw : 'Por definir'},
                    tituloRaw=${destacado != null ? destacado.titulo : null},
                    titulo=${tituloRaw != null and !#strings.isEmpty(tituloRaw) ? tituloRaw : 'Evento destacado'},
                    precioRaw=${destacado != null ? destacado.precioCentavos : null},
                    precio=${precioRaw != null ? precioRaw : 0},
                    eventoId=${destacado != null ? destacado.eventoId : null},
                    entradaTipoId=${destacado != null ? destacado.entradaTipoId : null}">
    <img class="w-100 hero-img"
         th:src="${tieneImagen} ? @{${imagenRaw}} : @{/img/hero.jpg}"
         alt="Evento destacado"/>

    <div class="position-absolute bottom-0 start-0 end-0 p-4 p-md-5 text-white"
         style="background: linear-gradient(180deg, rgba(12,16,31,0) 0%, rgba(12,16,31,0.82) 100%);">
      <div class="d-flex justify-content-between flex-wrap gap-3 mb-3 align-items-center">
        <span class="badge bg-info-subtle text-dark fw-medium">
          <span th:text="${categoria}">Categoria</span>
        </span>
        <div class="d-flex gap-2">
          <a th:href="@{/eventos}" class="btn btn-light btn-sm text-uppercase fw-semibold">
            Explorar eventos
          </a>
        </div>
      </div>

      <h2 class="fw-bold mb-2" th:text="${titulo}">Evento destacado</h2>

      <div class="d-flex flex-wrap gap-4 small opacity-75 mb-3">
        <span>
          <i class="bi bi-calendar2-event me-1"></i>
          <span th:text="${fechaTexto}">10 Ene 2026, 20:00</span>
        </span>
        <span>
          <i class="bi bi-geo-alt me-1"></i>
          <span th:text="${lugarTexto}">Lugar</span>
        </span>
      </div>

      <div class="d-flex flex-wrap gap-3 align-items-center">
        <div class="display-6 fw-bold">
          <span>S/</span>
          <span th:text="${#numbers.formatDecimal(precio / 100.0, 1, 2)}">0.00</span>
        </div>
        <a class="btn btn-teal btn-sm d-inline-flex align-items-center gap-2"
           th:if="${eventoId != null}"
           th:href="@{/eventos/{id}(id=${eventoId})}">
          <i class="bi bi-eye"></i>
          Ver detalles
        </a>
      </div>
    </div>
  </section>
</th:block>
</body>
</html>
