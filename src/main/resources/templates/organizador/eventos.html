<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de eventos - Gestion de eventos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/organizador.css}">
</head>
<body class="organizer-body">
<div class="organizer-layout">
  <div th:replace="~{organizador/fragments/sidebar :: sidebar('eventos')}"></div>

  <div class="organizer-main">
    <div th:replace="~{organizador/fragments/topbar :: topbar(${usuario})}"></div>

    <section class="organizer-content">
      <header class="org-page-title">
        <h1>Gestion de eventos</h1>
        <p>Administra todos tus eventos desde aqui</p>
      </header>

      <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
      <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

       <!-- Filtros -->
<form class="org-toolbar flex-wrap" method="get" th:action="@{/organizador/eventos}">
  <div class="org-search flex-grow p-0" style="border:none;">
    <i class="bi bi-search"></i>
    <input type="text"
           name="busqueda"
           placeholder="Buscar eventos..."
           th:value="${filtros.busqueda}">
  </div>

  <div class="position-relative">
    <select class="org-form-control" name="estado" th:value="${filtros.estado}">
      <option value="">Todos los estados</option>
      <option th:each="estado : ${estados}"
              th:value="${estado.valor}"
              th:text="${estado.label}">
      </option>
    </select>
  </div>

  <div class="position-relative">
   <select class="org-form-control" name="tipo" th:value="${filtros.tipo}">
  <option value="">Todos los tipos</option>

  <!-- Categorías manuales -->
  <option value="Acampados">Acampados</option>
  <option value="Conciertos">Conciertos</option>
  <option value="Ferias">Ferias</option>
  <option value="Prueba">Prueba</option>
  <option value="Sin categoria">Sin categoría</option>

</select>

  </div>

  <button class="org-btn-teal" type="submit">
    <i class="bi bi-search"></i> Buscar
  </button>

  <a class="org-btn-outline" th:href="@{/organizador/eventos}">
    Limpiar
  </a>

  <a class="org-btn-teal" th:href="@{/organizador/eventos/nuevo}">
    <i class="bi bi-plus-circle"></i> Crear nuevo evento
  </a>
</form>

<!-- Grilla de eventos -->
<div class="org-event-grid mt-3">
  <div th:each="evento : ${eventos}">
    <div th:replace="~{organizador/fragments/event-card :: eventCard(${evento})}"></div>
  </div>

  <p th:if="${#lists.isEmpty(eventos)}" class="text-center text-muted py-5">
    Aún no tienes eventos que coincidan con el filtro.
  </p>
</div>
<!-- Paginación -->
<nav th:if="${totalPaginas > 1}" class="mt-4">
  <ul class="pagination justify-content-center">

    <!-- Anterior -->
    <li class="page-item" th:classappend="${paginaActual == 0} ? ' disabled'">
      <a class="page-link"
         th:href="@{/organizador/eventos(
             page=${paginaActual - 1},
             size=${pageSize},
             busqueda=${filtros.busqueda},
             estado=${filtros.estado},
             tipo=${filtros.tipo}
         )}">
        &laquo;
      </a>
    </li>

    <!-- Números de página -->
    <li class="page-item"
        th:each="i : ${#numbers.sequence(0, totalPaginas - 1)}"
        th:classappend="${i == paginaActual} ? ' active'">
      <a class="page-link"
         th:text="${i + 1}"
         th:href="@{/organizador/eventos(
             page=${i},
             size=${pageSize},
             busqueda=${filtros.busqueda},
             estado=${filtros.estado},
             tipo=${filtros.tipo}
         )}">
      </a>
    </li>

    <!-- Siguiente -->
    <li class="page-item" th:classappend="${paginaActual == totalPaginas - 1} ? ' disabled'">
      <a class="page-link"
         th:href="@{/organizador/eventos(
             page=${paginaActual + 1},
             size=${pageSize},
             busqueda=${filtros.busqueda},
             estado=${filtros.estado},
             tipo=${filtros.tipo}
         )}">
        &raquo;
      </a>
    </li>

  </ul>
</nav>


<script>
  // Auto-submit al cambiar selects y al presionar Enter en búsqueda
  (function(){
    const form = document.querySelector('.org-toolbar');
    const busq = form?.querySelector('input[name="busqueda"]');
    form?.querySelectorAll('select[name="estado"], select[name="tipo"]').forEach(sel => {
      sel.addEventListener('change', () => form.submit());
    });
    busq?.addEventListener('keydown', e => {
      if (e.key === 'Enter') form.submit();
    });
  })();
</script>

    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.querySelectorAll('[data-sidebar-toggle]').forEach(btn => {
  btn.addEventListener('click', () => {
    const sidebar = document.getElementById('organizerSidebar');
    sidebar?.classList.toggle('open');
  });
});
</script>
</body>
</html>
