<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de eventos - Gestion de eventos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/organizador.css}">
</head>
<body class="organizer-body">
<div class="organizer-layout">
  <div th:replace="~{organizador/fragments/sidebar :: sidebar('eventos')}"></div>

  <div class="organizer-main">
    <div th:replace="~{organizador/fragments/topbar :: topbar(${usuario})}"></div>

    <section class="organizer-content">
      <header class="org-page-title">
        <h1>Gestion de eventos</h1>
        <p>Administra todos tus eventos desde aqui</p>
      </header>

      <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
      <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

      <div class="org-toolbar flex-wrap">
        <div class="org-search flex-grow p-0" style="border:none;">
          <i class="bi bi-search"></i>
          <input type="text" placeholder="Buscar eventos..." th:value="${filtros.busqueda}">
        </div>
        <div class="position-relative">
          <select class="org-form-control" name="estado">
            <option value="">Todos los estados</option>
            <option th:each="estado : ${estados}" th:value="${estado.valor}"
                    th:text="${estado.label}"
                    th:selected="${filtros.estado != null} ? ${filtros.estado == estado.valor} : false"></option>
          </select>
        </div>
        <div class="position-relative">
          <select class="org-form-control" name="tipo">
            <option value="">Todos los tipos</option>
            <option th:each="tipo : ${tipos}" th:value="${tipo.valor}"
                    th:text="${tipo.label}"
                    th:selected="${filtros.tipo != null} ? ${filtros.tipo == tipo.valor} : false"></option>
          </select>
        </div>
        <a class="org-btn-teal" th:href="@{/organizador/eventos/nuevo}">
          <i class="bi bi-plus-circle"></i> Crear nuevo evento
        </a>
      </div>

      <div class="org-event-grid">
        <div th:each="evento : ${eventos}">
          <div th:replace="~{organizador/fragments/event-card :: eventCard(${evento})}"></div>
        </div>
        <p th:if="${#lists.isEmpty(eventos)}" class="text-center text-muted py-5">
          Aun no tienes eventos creados. Empieza con el boton <strong>Crear nuevo evento</strong>.
        </p>
      </div>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.querySelectorAll('[data-sidebar-toggle]').forEach(btn => {
  btn.addEventListener('click', () => {
    const sidebar = document.getElementById('organizerSidebar');
    sidebar?.classList.toggle('open');
  });
});
</script>
</body>
</html>
