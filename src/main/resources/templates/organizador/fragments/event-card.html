<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="eventCard(evento)">
  <article class="org-event-card">
    <div class="org-event-thumb"
         th:with="tieneImagen=${evento.imagenUrl != null and !#strings.isEmpty(evento.imagenUrl)}">
      <img th:src="${tieneImagen} ? ${evento.imagenUrl} : @{/img/placeholder-event.png}"
           alt="Imagen del evento">
    </div>
    <div class="org-tag-row">
      <span class="org-tag" th:text="${evento.estado}">Proximo</span>
      <span class="org-tag badge-soft" th:text="${evento.categoria}">Festival Cultural</span>
    </div>
    <div>
      <h3 class="h6 mb-2" th:text="${evento.titulo}">Festival del Limon</h3>
      <div class="org-meta">
        <span><i class="bi bi-calendar-event me-1"></i><span th:text="${evento.fecha}">15 Nov 2025</span></span>
        <span><i class="bi bi-geo-alt me-1"></i><span th:text="${evento.lugar}">Plaza de Armas</span></span>
        <span><i class="bi bi-people me-1"></i><span th:text="${evento.entradas}">1850/2500 entradas vendidas</span></span>
        <span><i class="bi bi-cash-coin me-1"></i><span th:text="${evento.ingresos}">S/ 45,000</span></span>
      </div>
    </div>

    <div>
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="text-muted small">Ventas</span>
        <span class="fw-semibold" th:text="${evento.progreso}">74%</span>
      </div>
      <div class="org-progress">
        <span th:style="'width:' + (${evento.progreso} != null ? evento.progreso : '0%')"></span>
      </div>
    </div>

    <div class="org-event-actions">
      <a th:href="${evento.detalleUrl}" class="btn btn-outline-secondary flex-fill">
        <i class="bi bi-eye"></i> Ver detalles
      </a>
      <a th:href="${evento.editarUrl}" class="btn btn-outline-secondary">
        <i class="bi bi-pencil"></i>
      </a>
      <a th:href="${evento.eliminarUrl}" class="btn btn-outline-danger">
        <i class="bi bi-trash"></i>
      </a>
    </div>
  </article>
</th:block>
</body>
</html>
