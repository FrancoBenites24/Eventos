<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer Contrasena - Eventos Piura</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(180deg, #eefbff 0%, #f8feff 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
    }
    .recover-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 16px;
    }
    .recover-card {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 16px;
      padding: 36px;
      box-shadow: 0 12px 40px rgba(0, 94, 118, 0.12);
    }
    .btn-brand {
      background-color: #00a6c9;
      border: none;
      border-radius: 8px;
      color: #fff;
      padding: 12px;
      font-weight: 600;
    }
    .btn-brand:hover {
      background-color: #0091b2;
    }
    .muted {
      color: #6b93a1;
    }
  </style>
</head>
<body>
  <div class="recover-wrapper">
    <div class="recover-card">
      <h4 class="fw-semibold mb-2" style="color:#1f4a58;">Recuperar contrasena</h4>
      <p class="muted mb-4">
        Ingresa el correo asociado a tu cuenta y enviaremos un enlace para que definas una nueva contrasena.
      </p>

      <div th:if="${success}" class="alert alert-success" role="alert">
        <span th:text="${success}">Mensaje de confirmacion</span>
      </div>
      <div th:if="${error}" class="alert alert-danger" role="alert">
        <span th:text="${error}">Ha ocurrido un error</span>
      </div>

      <form th:action="@{/auth/recuperar}" method="post" th:object="${recuperarRequest}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3">
          <label class="form-label small text-uppercase text-muted">Correo electronico</label>
          <input type="email"
                 class="form-control form-control-lg"
                 th:field="*{correo}"
                 placeholder="correo@ejemplo.com"
                 required>
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
        </div>
        <button type="submit" class="btn btn-brand w-100">Enviar instrucciones</button>
      </form>

      <div class="mt-4 text-center">
        <a th:href="@{/auth/login}" class="small link-secondary">Volver al inicio de sesion</a>
      </div>
    </div>
  </div>
</body>
</html>
