<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Definir nueva contrasena</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(180deg, #eefbff 0%, #f8feff 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
    }
    .reset-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 16px;
    }
    .reset-card {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 16px;
      padding: 36px;
      box-shadow: 0 12px 40px rgba(0, 94, 118, 0.12);
    }
    .btn-brand {
      background-color: #00a6c9;
      border: none;
      border-radius: 8px;
      color: #fff;
      padding: 12px;
      font-weight: 600;
    }
    .btn-brand:hover {
      background-color: #0091b2;
    }
    .muted {
      color: #6b93a1;
    }
  </style>
</head>
<body>
  <div class="reset-wrapper">
    <div class="reset-card">
      <h4 class="fw-semibold mb-2" style="color:#1f4a58;">Define tu nueva contrasena</h4>
      <p class="muted mb-4">
        La nueva contrasena debe tener al menos 8 caracteres, incluir mayusculas, minusculas, un numero y un simbolo.
      </p>

      <form th:action="@{/auth/restablecer}" method="post" th:object="${restablecerRequest}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" th:field="*{token}">

        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" role="alert">
          <span th:each="err : ${#fields.globalErrors()}" th:text="${err}">Ha ocurrido un error</span>
        </div>

        <div class="mb-3">
          <label class="form-label small text-uppercase text-muted">Nueva contrasena</label>
          <input type="password"
                 class="form-control form-control-lg"
                 th:field="*{contrasena}"
                 placeholder="********"
                 required>
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('contrasena')}" th:errors="*{contrasena}"></div>
        </div>

        <div class="mb-4">
          <label class="form-label small text-uppercase text-muted">Confirmar contrasena</label>
          <input type="password"
                 class="form-control form-control-lg"
                 th:field="*{confirmarContrasena}"
                 placeholder="********"
                 required>
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmarContrasena')}" th:errors="*{confirmarContrasena}"></div>
        </div>

        <button type="submit" class="btn btn-brand w-100">Guardar contrasena</button>
      </form>

      <div class="mt-4 text-center">
        <a th:href="@{/auth/login}" class="small link-secondary">Volver al inicio de sesion</a>
      </div>
    </div>
  </div>
</body>
</html>
