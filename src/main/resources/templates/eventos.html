<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eventia - Eventos</title>

  <meta name="_csrf" th:if="${_csrf}" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:if="${_csrf}" th:content="${_csrf.headerName}"/>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
  <link rel="stylesheet" th:href="@{/css/styles.css}" href="/static/css/styles.css"/>
</head>
<body class="bg-body-tertiary">

  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main class="container-xxl" th:with="hayEventos=${porCat != null and !#maps.isEmpty(porCat)}">

    <div th:if="${destacado != null}"
         th:replace="~{fragments/_hero :: hero(${destacado})}"></div>

    <div th:if="${!hayEventos}" class="text-center py-5 text-muted">
      A&uacute;n no hay eventos publicados. Vuelve pronto para descubrir nuevas experiencias.
    </div>

    <div th:if="${hayEventos}"
         th:replace="~{fragments/_category-pills :: categoryPills(${porCat})}"></div>

    <section th:if="${hayEventos}" th:each="entry : ${porCat}" class="mb-5">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="section-title mb-0" th:text="${entry.key}">Conciertos</h5>
        <a href="#" class="link-dark small text-decoration-none d-inline-flex align-items-center gap-1">
          Ver todos <i class="bi bi-arrow-right-short fs-5"></i>
        </a>
      </div>

      <div class="row g-3">
        <div class="col-12 col-sm-6 col-lg-4 col-xl-3"
             th:each="card, iterStat : ${entry.value}"
             th:if="${iterStat.index < 4}">
          <div th:replace="~{fragments/_event-card :: eventCard(${card})}"></div>
        </div>
      </div>
    </section>

    <section class="rounded-4 p-5 gradient-cta text-center text-white my-5">
      <h4 class="fw-semibold mb-2">&iquest;Organizas eventos?</h4>
      <p class="opacity-75 mb-4">&Uacute;nete y vende tus entradas de forma segura.</p>
      <a href="#" class="btn btn-light btn-lg px-4">Crear mi Evento</a>
    </section>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
  <div th:replace="~{fragments/_offcanvas-cart :: offcanvasCart}"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function () {
      const header = document.querySelector('meta[name="_csrf_header"]')?.content;
      const token  = document.querySelector('meta[name="_csrf"]')?.content;

      document.addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-add-to-cart]');
        if (!btn) return;

        const payload = new URLSearchParams({
          eventoId: btn.dataset.eventoId,
          entradaTipoId: btn.dataset.entradaTipoId,
          titulo: btn.dataset.titulo,
          precioCentavos: btn.dataset.precio
        });

        const resp = await fetch('/carrito/agregar', {
          method: 'POST',
          headers: Object.assign(
            {'Content-Type': 'application/x-www-form-urlencoded'},
            header && token ? {[header]: token} : {}
          ),
          body: payload.toString()
        });

        if (resp.ok) {
          const data = await resp.json();
          const badge = document.querySelector('[data-cart-count]');
          if (badge) {
            badge.textContent = data.count;
            badge.classList.toggle('invisible', data.count === 0);
          }

          const oc = document.getElementById('offcanvasCart');
          if (oc) {
            const off = bootstrap.Offcanvas.getOrCreateInstance(oc);
            await refreshCart();
            off.show();
          }
        }
      });

      async function refreshCart() {
        const panel = document.querySelector('#offcanvasCart .offcanvas-body');
        if (!panel) return;
        const html = await fetch('/carrito/panel').then(r => r.text());
        const temp = document.createElement('div');
        temp.innerHTML = html;
        const inner = temp.querySelector('#offcanvasCart .offcanvas-body');
        if (inner) panel.innerHTML = inner.innerHTML;
      }
    })();
  </script>
</body>
</html>
